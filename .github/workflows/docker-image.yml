name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# jobs:

  # build:

  #   runs-on: ubuntu-latest

  #   steps:
  #   - uses: actions/checkout@v4
  #   - name: Build the Docker image
  #     run: docker build . --file Dockerfile --tag my-image-name:$(date +%s)

  
  
  env:
  REGISTRY: docker.io
  IMAGE_NAME_PREFIX: https://github.com/Iradukunda-Fils/Lnex/
  DOCKER_COMPOSE_FILE: ./configs/docker-compose.yaml

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: ⬇️ Checkout repository
      uses: actions/checkout@v3

    - name: 🐍 Set up Python (optional if you run tests)
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: ⚙️ Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: 🐳 Login to DockerHub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: 🏗️ Build and tag services
      run: |
        docker compose -f $DOCKER_COMPOSE_FILE build

    - name: 🧪 Run tests (optional - add custom test commands here)
      run: |
        echo "🔍 Running tests..."
        # docker compose -f $DOCKER_COMPOSE_FILE run --rm lnex_auth pytest
        # Add test runners for other services if needed

    - name: 📦 Push images to Docker Hub
      run: |
        docker tag lnex_auth $REGISTRY/$IMAGE_NAME_PREFIX-auth:latest
        docker tag lnex_learn $REGISTRY/$IMAGE_NAME_PREFIX-learn:latest
        docker tag lnex_payment $REGISTRY/$IMAGE_NAME_PREFIX-payment:latest
        docker tag lnex_communication $REGISTRY/$IMAGE_NAME_PREFIX-comm:latest
        docker tag lnex_micro $REGISTRY/$IMAGE_NAME_PREFIX-micro:latest

        docker push $REGISTRY/$IMAGE_NAME_PREFIX-auth:latest
        docker push $REGISTRY/$IMAGE_NAME_PREFIX-learn:latest
        docker push $REGISTRY/$IMAGE_NAME_PREFIX-payment:latest
        docker push $REGISTRY/$IMAGE_NAME_PREFIX-comm:latest
        docker push $REGISTRY/$IMAGE_NAME_PREFIX-micro:latest

    # Optional deploy via SSH
